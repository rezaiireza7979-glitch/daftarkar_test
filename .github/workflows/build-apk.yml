name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: اجازه اجرا به gradlew
        run: chmod +x ./gradlew

      - name: ساخت APK دیباگ
        run: ./gradlew assembleDebug

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-kar-apk
          path: app/build/outputs/apk/debug/app-debug.apk
